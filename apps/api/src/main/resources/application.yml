spring:
  application:
    name: meca-dojo-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meca_dojo}
    username: ${DB_USER:meca_dojo}
    password: ${DB_PASSWORD:meca_dojo_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${API_PORT:8080}
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    tenant-name: ${BOOTSTRAP_TENANT_NAME:Meca Dojo}
    tenant-slug: ${BOOTSTRAP_TENANT_SLUG:meca-dojo}
    owner-name: ${BOOTSTRAP_OWNER_NAME:Admin Local}
    owner-email: ${BOOTSTRAP_OWNER_EMAIL:admin@mecadojo.local}
    owner-password: ${BOOTSTRAP_OWNER_PASSWORD:}
