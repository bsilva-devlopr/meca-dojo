spring:
  application:
    name: meca-dojo-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meca_dojo}}
    username: ${DATABASE_USERNAME:${DB_USER:meca_dojo}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:meca_dojo_dev}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
server:
  port: ${PORT:${API_PORT:8080}}
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    tenant-name: ${BOOTSTRAP_TENANT_NAME:Meca Dojo}
    tenant-slug: ${BOOTSTRAP_TENANT_SLUG:meca-dojo}
    owner-name: ${BOOTSTRAP_OWNER_NAME:Admin Local}
    owner-email: ${BOOTSTRAP_OWNER_EMAIL:admin@mecadojo.local}
    owner-password: ${BOOTSTRAP_OWNER_PASSWORD:}
  check-in:
    qr-ttl-seconds: ${CHECKIN_QR_TTL_SECONDS:60}
    web-base-url: ${CHECKIN_WEB_BASE_URL:${APP_PUBLIC_URL:http://localhost:3000}}
